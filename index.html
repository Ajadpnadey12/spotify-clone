   
   
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style4.css">
    <link rel="stylesheet" href="utility.css">
    <title>Spotfiy - Web Player: Music for Everyone</title>
</head>

<body>
    <div class="container flex bg-black">

        <div class="left">

            <div class="close"> 
                <img width="30" class="invert" src="close.svg" alt="Close">
            </div>

            <div class="home bg-gray rounded m-1 p-1">
                <div class="logo">
                    <img width="110" class="invert" src="logo.svg" alt="Spotify Logo">
                </div>

                <ul>
                    <li>
                        <img class="invert" src="home.svg" alt="Home">
                        Home
                    </li>
                    <li>
                        <img class="invert" src="search.svg" alt="Search">
                        Search
                    </li>
                </ul>
            </div>

            <div class="library bg-gray m-1 p-1">

                <div class="heading">
                    <img class="invert" src="playlist.svg" alt="Playlist">
                    <h2>Your Library</h2>
                </div>

                <div class="songList">
                    <ul></ul>
                </div>

                <div class="footer">
                    <div><a href="https://www.spotify.com/jp/legal/" target="_blank">Legal</a></div>
                    <div><a href="https://www.spotify.com/jp/privacy/" target="_blank">Privacy Center</a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/" target="_blank">Privacy Policy</a></div>
                    <div><a href="https://www.spotify.com/jp/legal/cookies-policy/" target="_blank">Cookies</a></div>
                    <div><a href="https://www.spotify.com/jp/legal/privacy-policy/#s3" target="_blank">About Ads</a></div>
                    <div><a href="https://www.spotify.com/jp/accessibility/" target="_blank">Accessibility</a></div>
                </div>

            </div>
        </div>

        
        <div class="right bg-gray rounded">

            <div class="header">

                <div class="nav">
                    <div class="hamburgercontainer">

                        <img width="40" class="invert hamburger" src="hamburger.svg" alt="Menu">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             viewBox="0 0 24 24"
                             width="24"
                             height="24"
                             fill="none"
                             stroke="#ffffff"
                             stroke-width="1.5"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"></path>
                        </svg>

                        <svg xmlns="http://www.w3.org/2000/svg"
                             viewBox="0 0 24 24"
                             width="24"
                             height="24"
                             fill="none"
                             stroke="#ffffff"
                             stroke-width="1.5"
                             stroke-linecap="round"
                             stroke-linejoin="round">
                            <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"></path>
                        </svg>

                    </div>
                </div>

                <div class="buttons">
                    <button class="signupbtn">Sign Up</button>
                    <button class="loginbtn">Log In</button>
                </div>

            </div>

            
            <div class="spotifyplaylist">

                <h1>Spotify Playlist</h1>

                <div class="cardcontainer">


                </div> 

               
                <div class="playbar">

                    <div class="seekbar">
                        <div class="circle"></div>
                    </div>

                   <div class="abovebar">

    <div class="songinfo"></div>

    <div class="songbutton">
        <img id="previous" src="previous.svg" alt="Previous">
        <img id="play" src="play.svg" alt="Play">
        <img id="next" src="next.svg" alt="Next">
    </div>

    <div class="timevol">
        <div class="songtime"></div>

        <div class="volume">
            <img width="25" src="volume.svg" alt="">
            <div class="range">
                <input type="range" name="volume" min="0" max="100" value="10">
            </div>
        </div>
    </div>

</div>

                </div>

            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
